name: Build APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: '8.4'

    - name: Get App Version
      id: app_version
      run: |
        VERSION=$(grep "versionName" app/build.gradle | sed 's/.*versionName[[:space:]]*["\x27]\([^"\x27]*\)["\x27].*/\1/')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "App Version: $VERSION"

    - name: Build Debug APK
      run: |
        rm -rf ~/.gradle/caches/transforms-*
        gradle clean assembleDebug --no-build-cache

    - name: Build Release APK
      run: gradle assembleRelease

    - name: Sign APKs
      run: |
        mkdir -p signing
        echo "$PEM" | base64 -d > signing/platform.pem
        echo "$X509" | base64 -d > signing/platform.x509.pem
        chmod 600 signing/platform.pem
        BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
        APKSIGNER="${BUILD_TOOLS}apksigner"
        VERSION="${{ steps.app_version.outputs.version }}"
        mkdir -p ./apk
        $APKSIGNER sign --key signing/platform.pem --cert signing/platform.x509.pem --out "./apk/panda-car-launcher-v${VERSION}-debug.apk" app/build/outputs/apk/debug/app-debug.apk
        $APKSIGNER sign --key signing/platform.pem --cert signing/platform.x509.pem --out "./apk/panda-car-launcher-v${VERSION}-release.apk" app/build/outputs/apk/release/app-release-unsigned.apk
        $APKSIGNER verify --print-certs "./apk/panda-car-launcher-v${VERSION}-debug.apk"
        $APKSIGNER verify --print-certs "./apk/panda-car-launcher-v${VERSION}-release.apk"
        rm -rf signing
      env:
        PEM: ${{ secrets.SIGNING_PLATFORM_PEM }}
        X509: ${{ secrets.SIGNING_PLATFORM_X509 }}

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.app_version.outputs.version }}
        name: "熊猫车机桌面 v${{ steps.app_version.outputs.version }}"
        files: ./apk/*.apk
        body: |
          ## 熊猫车机桌面 v${{ steps.app_version.outputs.version }}
          ### 下载
          - Debug 版本: `panda-car-launcher-v${{ steps.app_version.outputs.version }}-debug.apk`
          - Release 版本: `panda-car-launcher-v${{ steps.app_version.outputs.version }}-release.apk`
          ### 说明
          - 所有 APK 均使用 platform 签名
          - 安装到 /system/priv-app/ 可获得系统级权限
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
