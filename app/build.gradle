plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.pandora.carlauncher'
    compileSdk 34

    defaultConfig {
        applicationId "com.pandora.carlauncher"
        minSdk 26
        targetSdk 34
        versionCode 69
        versionName "4.9.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    // AndroidAutoSize 屏幕适配
    implementation 'com.github.JessYanCoding:AndroidAutoSize:v1.2.0'
    // 注意：android.car 库仅在系统编译环境(AOSP)中可用
    // 普通Android Studio编译使用反射调用，不直接依赖
    // compileOnly 'android.car:car:1.0.0' // 系统编译时取消注释
}
